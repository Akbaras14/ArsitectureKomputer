<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eksplorasi CPU 3D</title>
  <link rel="stylesheet" href="css/component-explorer.css">
</head>
<body>
  <header><a href="index.html">&larr; Kembali ke beranda</a><span>Arsitektur dan Organisasi Komputer</span><a href="materi.html">Semua materi &nearr;</a></header>
  <main>
    <div class="heading"><p class="eyebrow">Eksplorasi komponen</p><h1>CPU</h1></div>
    <section class="scene" aria-label="Model CPU interaktif">
      <model-viewer id="cpu-model" src="assets/componens/cpu.glb" alt="Model CPU 3D di tengah layar. Putar dengan menyeret atau tombol panah, lalu pilih tombol komponen untuk membaca penjelasan." camera-controls auto-rotate auto-rotate-delay="1000" rotation-per-second="20deg" camera-orbit="-25deg 45deg 115%" min-camera-orbit="auto 0deg 65%" max-camera-orbit="auto 180deg 180%" touch-action="pan-y" shadow-intensity="1" exposure="1" loading="eager" interaction-prompt="none">
        <div class="callout" slot="hotspot-ihs" data-position="0m 0.168m 0m">
          <svg width="1" height="1" aria-hidden="true"><line x1="0" y1="0"/><circle r="4"/></svg>
          <button data-part="0" aria-pressed="false" aria-controls="component-info">Pelindung panas</button>
        </div>
        <div class="callout substrate" slot="hotspot-substrate" data-position="-1.8m -0.02m 1m">
          <svg width="1" height="1" aria-hidden="true"><line x1="0" y1="0"/><circle r="4"/></svg>
          <button data-part="1" aria-pressed="false" aria-controls="component-info">Substrat</button>
        </div>
        <div class="callout bottom" slot="hotspot-bottom" data-position="0m -0.083m 0m">
          <svg width="1" height="1" aria-hidden="true"><line x1="0" y1="0"/><circle r="4"/></svg>
          <button data-part="2" aria-pressed="false" aria-controls="component-info">Sisi bawah</button>
        </div>
      </model-viewer>
      <p id="model-status" role="status">Memuat model CPU 3D…</p>
      <p class="gesture">Seret untuk memutar. Scroll atau cubit untuk zoom. Klik nama komponen untuk melihat penjelasan.</p>
    </section>
    <aside class="monitor" id="component-info" aria-label="Penjelasan komponen" hidden>
      <div class="monitor-frame"><div class="screen">
        <div class="screen-header"><span>cpu@localhost:~ / info</span><button id="close-info" aria-label="Tutup penjelasan">&times;</button></div>
        <h2 id="part-title"></h2><p id="part-description" aria-hidden="true"></p>
        <p id="terminal-announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
      </div></div>
    </aside>
    <div class="footer"><span>Central Processing Unit / Eksplorasi 3D</span><a href="assets/componens/cpu.glb" download>Unduh model CPU</a></div>
    <noscript><p>Aktifkan JavaScript untuk memutar model. <a href="materi.html">Baca materi CPU</a>.</p></noscript>
  </main>
  <script type="application/json" id="component-data">
[
  {
    "title": "Pelindung panas",
    "orbit": "0deg 25deg 115%",
    "text": "Integrated Heat Spreader (IHS) adalah permukaan logam yang menyebarkan panas dari chip ke pendingin melalui pasta termal. Pendinginan membantu menjaga suhu CPU tetap terkendali saat menjalankan instruksi."
  },
  {
    "title": "Substrat",
    "orbit": "-45deg 65deg 115%",
    "text": "Papan tipis ini menopang chip dan membawa jalur listrik antara chip dengan kontak di bagian bawah. Jalur tersebut mengantarkan daya dan sinyal sehingga CPU dapat berkomunikasi dengan sistem komputer."
  },
  {
    "title": "Sisi bawah",
    "orbit": "0deg 150deg 115%",
    "text": "Bagian bawah menghadap soket motherboard. Pada CPU jenis LGA, bidang kontak CPU bertemu pin di soket untuk menyalurkan daya dan sinyal. Hindari mengotori area kontak agar sambungan tetap baik."
  }
]
  </script>
  <script type="module" src="js/component-explorer.js"></script>
</body>
</html>
